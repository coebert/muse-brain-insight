name: Verify research EEG app
on:
  push:
    branches: [research/eeg-baselines]
    paths:
      - 'src/**'
      - '.github/workflows/eeg-research-app.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/lib/eeg/research-eeg-baseline.test.ts
      - run: bun run build
