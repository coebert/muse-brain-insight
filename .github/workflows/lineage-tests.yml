# Gating regressions are clinical safety regressions: if a change lets COEBIS or
# the seizure detector run on a montage they were never calibrated on, that must
# stop the pull request before anything else is spent on it.
name: Model lineage gating

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lineage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lineage-gating:
    name: Lineage gating (fail fast)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fails on the first failing file, so a broken gate reports in seconds.
      - name: Lineage compatibility, gating and fixtures
        run: |
          bunx vitest run --bail=1 --reporter=verbose \
            src/lib/eeg/model-lineage.test.ts \
            src/lib/eeg/model-lineage.e2e.test.ts \
            src/lib/eeg/lineage-fixtures.test.ts \
            src/lib/eeg/model-config-schema.test.ts \
            src/lib/eeg/model-migration.test.ts \
            src/lib/eeg/runtime-guard.test.ts \
            src/components/monitor/lineage-blocked.e2e.test.tsx \
            src/components/monitor/dsa-ingest.e2e.test.tsx \
            src/components/monitor/suppression-metrics.e2e.test.tsx \
            src/components/monitor/seizure-gating-stability.e2e.test.tsx \
            src/lib/eeg/anonymised-save.e2e.test.ts \
            src/components/monitor/playback-alignment.e2e.test.tsx \
            src/lib/eeg/dsa-spectral-mapping.e2e.test.ts \
            src/components/monitor/playback-performance.e2e.test.tsx \
            src/lib/eeg/seizure-alert.e2e.test.ts \
            src/lib/eeg/suppression-groundtruth.e2e.test.ts \
            src/lib/eeg/ingest-latency.e2e.test.ts \
            src/lib/eeg/suppression-onset-offset.e2e.test.ts \
            src/components/monitor/dropout-resilience.e2e.test.tsx \
            src/lib/eeg/pipeline-latency.e2e.test.ts \
            src/lib/eeg/artefact-suppression.e2e.test.ts \
            src/lib/eeg/packet-loss-suppression.e2e.test.ts \
            src/lib/eeg/muse-emulator-session.e2e.test.ts \
            src/lib/eeg/dropout-seizure-grid.e2e.test.ts \
            src/lib/eeg/long-duration-session.e2e.test.ts \
            src/lib/eeg/threshold-sweep.e2e.test.ts \
            src/lib/eeg/storage-integrity.e2e.test.ts \
            src/lib/eeg/descriptor-only.test.ts \
            src/lib/eeg/interpret-guard.test.ts \
            src/lib/eeg/case-observations.test.ts \
            src/lib/eeg/case-observations.response.test.ts \
            src/components/admin/ResearchLearningPanel.test.tsx \
            src/lib/eeg/research-eeg-baseline.test.ts

  research-guardrails:
    name: Research guardrails (descriptor-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.0.2 scipy==1.13.1 scikit-learn==1.6.1 joblib==1.5.3 \
            pandas==2.2.3 requests==2.32.5

      - name: Research replay, allowlist and aggregate tests
        run: python -m unittest discover -s research/learning/tests -v

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install app dependencies
        run: bun install --frozen-lockfile

      - name: Descriptor-only guard, observation and export tests
        run: |
          bunx vitest run --reporter=verbose \
            src/lib/eeg/descriptor-only.test.ts \
            src/lib/eeg/interpret-guard.test.ts \
            src/lib/eeg/case-observations.test.ts \
            src/lib/eeg/case-observations.response.test.ts \
            src/components/admin/ResearchLearningPanel.test.tsx \
            src/lib/eeg/research-eeg-baseline.test.ts

  full-suite:
    name: Types and full test suite
    runs-on: ubuntu-latest
    # Only worth running once the gating checks are green.
    needs: [lineage-gating, research-guardrails]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsgo --noEmit -p tsconfig.json

      - name: Test suite
        run: bun run test
